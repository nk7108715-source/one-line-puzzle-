function setStatus(t){document.getElementById('status').textContent=t}
function render(){const p=puzzles[level];document.getElementById('level').textContent=(level+1)+' / 20';document.getElementById('prog').style.width=(used.size/p.edges.length*100)+'%';board.innerHTML='';const ns='http://www.w3.org/2000/svg';function el(tag,attrs){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));board.appendChild(e);return e}
for(const [a,b] of p.edges){const done=used.has(key(a,b));el('line',{x1:p.points[a][0],y1:p.points[a][1],x2:p.points[b][0],y2:p.points[b][1],stroke:done?'#40ffb0':'#60c7f2','stroke-width':done?3.8:2.2,'stroke-linecap':'round',opacity:done?1:.72})}
for(let i=0;i<p.points.length;i++){let [x,y]=p.points[i];el('circle',{cx:x,cy:y,r:current()===i?5.5:3.5,fill:current()===i?'#f8d36a':'#e7f9ff',stroke:'#19a7f1','stroke-width':1.2})}document.getElementById('next').style.display=finished?'block':'none'}
function tap(i){if(finished)return;if(!trail.length){trail.push(i);render();return}const a=current();if(i===a)return;const p=puzzles[level];if(!p.edges.some(([u,v])=>(u===a&&v===i)||(u===i&&v===a))){setStatus('Choose a connected dot');return}const k=key(a,i);if(used.has(k)){setStatus('Line already traced');return}used.add(k);trail.push(i);setStatus('');if(used.size===p.edges.length){finished=true;setTimeout(celebrate,240)}render()}
function nearest(e){const rect=board.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*300,y=(e.clientY-rect.top)/rect.height*300;let best=-1,d=Infinity;puzzles[level].points.forEach(([px,py],i)=>{let z=Math.hypot(px-x,py-y);if(z<d){d=z;best=i}});return d<15?best:-1}
board.addEventListener('pointerdown',e=>{drag=true;board.setPointerCapture(e.pointerId);const i=nearest(e);if(i>=0)tap(i)});board.addEventListener('pointermove',e=>{if(!drag)return;const i=nearest(e);if(i>=0)tap(i)});board.addEventListener('pointerup',()=>drag=false);board.addEventListener('pointercancel',()=>drag=false);
document.getElementById('retry').onclick=()=>{trail=[];used.clear();finished=false;setStatus('');render()};document.getElementById('undo').onclick=()=>{if(trail.length>1){let b=trail.pop(),a=current();used.delete(key(a,b))}else trail=[];finished=false;setStatus('');render()};
function next(){if(level===19){overlay.style.display='none';setStatus('All 20 puzzles completed!');return}level++;localStorage.setItem('oneLineVerifiedLevel',level);trail=[];used.clear();finished=false;overlay.style.display='none';setStatus('');render()}
document.getElementById('next').onclick=next;document.getElementById('modalNext').onclick=next;
document.getElementById('hint').onclick=()=>{if(!confirm('Demo rewarded ad: unlock one hint? Real ads require Android AdMob.'))return;const sol=puzzles[level].solution;if(!trail.length){setStatus('Hint: start at the glowing dot');const [x,y]=puzzles[level].points[sol[0]];let c=document.createElementNS('http://www.w3.org/2000/svg','circle');for(let [k,v] of Object.entries({cx:x,cy:y,r:10,fill:'none',stroke:'#facc15','stroke-width':3}))c.setAttribute(k,v);board.appendChild(c)}else{let options=puzzles[level].edges.filter(([a,b])=>(a===current()||b===current())&&!used.has(key(a,b)));setStatus(options.length?'Hint: try the dot at '+(options[0][0]===current()?options[0][1]+1:options[0][0]+1):'No remaining line here — Undo')}};
document.getElementById('skip').onclick=()=>{if(confirm('Demo rewarded ad: skip this puzzle?'))next()};
function celebrate(){document.getElementById('congrats').textContent=['CONGRATULATIONS!','GREAT JOB!','YIPPEE!','AMAZING!'][level%4];document.getElementById('completed').textContent='Puzzle '+(level+1)+' Completed!';const s=document.getElementById('sparks');s.innerHTML='';for(let i=0;i<55;i++){let e=document.createElement('span');e.className='spark';e.style.setProperty('--r',Math.random()*360+'deg');e.style.setProperty('--d',(80+Math.random()*270)+'px');e.style.setProperty('--c',['#22d3ee','#facc15','#f472b6','#a78bfa'][i%4]);e.style.animationDelay=(Math.random()*.5)+'s';s.appendChild(e)}overlay.style.display='flex'}render();</script></body></html>
