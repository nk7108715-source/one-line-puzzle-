<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verified Ultra Hard One Line Puzzle</title><style>*{box-sizing:border-box}body{margin:0;background:#050d20;color:#eafaff;font:15px system-ui;text-align:center}.wrap{max-width:650px;margin:auto;padding:16px}h1{font-size:23px;margin:8px 0;color:#67e8f9}.sub{color:#9bb5d5;margin:5px 0 12px}.board{background:radial-gradient(circle at center,#15294e,#070f23);border:2px solid #13d8fa;border-radius:20px;box-shadow:0 0 22px #06b6d433;touch-action:none;width:100%;max-height:72vh}line{stroke:#53c9f9;stroke-width:3;stroke-linecap:round}line.done{stroke:#f9c74f;stroke-width:6}circle{fill:#fff;stroke:#27c7f7;stroke-width:2}circle.active{fill:#facc15;stroke:#fff;stroke-width:3}button{border:1px solid #36b8ee;border-radius:12px;padding:12px 15px;background:#123466;color:white;font-weight:700;margin:5px;cursor:pointer}.info{color:#c7e1f9;min-height:24px}.ok{color:#6df4b5;font-weight:bold}.small{font-size:12px;color:#9cb6d3}</style></head><body><div class="wrap"><h1>ONE LINE • VERIFIED ULTRA HARD</h1><p class="sub">Straight lines • Each edge exactly once • Lift finger allowed</p><svg id="board" class="board" viewBox="0 0 440 440" aria-label="Puzzle diagram"></svg><p id="status" class="info">Tap any dot to start, then trace to connected dots.</p><div><button id="undo">↶ Undo</button><button id="retry">↻ Retry</button><button id="hint">💡 Hint</button><button id="solve">▶ Show Solution</button></div><p id="counter" class="small"></p><p class="small">Solution button is for verification/demo; it will not be in the final challenge mode.</p></div><script>const DATA={"points":{"0":[174,82],"1":[220,82],"2":[266,82],"3":[128,128],"4":[174,128],"6":[266,128],"7":[312,128],"8":[82,174],"9":[128,174],"13":[312,174],"14":[358,174],"15":[82,220],"21":[358,220],"22":[82,266],"23":[128,266],"27":[312,266],"28":[358,266],"29":[128,312],"30":[174,312],"32":[266,312],"33":[312,312],"34":[174,358],"35":[220,358],"36":[266,358]},"edges":[[0,1],[0,4],[1,2],[1,6],[1,4],[2,6],[3,4],[3,9],[4,9],[6,7],[6,13],[7,13],[8,9],[8,15],[9,15],[13,14],[13,21],[14,21],[15,22],[15,23],[21,28],[21,27],[22,23],[23,29],[23,30],[27,33],[27,28],[27,32],[29,30],[30,34],[30,35],[32,36],[32,33],[32,35],[34,35],[35,36]],"solution":[0,4,9,15,23,30,35,36,32,33,27,28,21,14,13,7,6,13,21,27,32,35,34,30,29,23,22,15,8,9,3,4,1,6,2,1,0]};const svg=document.getElementById('board'),status=document.getElementById('status'),counter=document.getElementById('counter');const NS='http://www.w3.org/2000/svg';let used=[],current=null,route=[],playing=false,timer=null;const edgeKey=(a,b)=>[a,b].sort((x,y)=>x-y).join('-');const keys=DATA.edges.map(e=>edgeKey(...e));function draw(){svg.innerHTML='';DATA.edges.forEach(([a,b],i)=>{let e=document.createElementNS(NS,'line');e.setAttribute('x1',DATA.points[a][0]);e.setAttribute('y1',DATA.points[a][1]);e.setAttribute('x2',DATA.points[b][0]);e.setAttribute('y2',DATA.points[b][1]);if(used.includes(i))e.classList.add('done');svg.appendChild(e)});Object.entries(DATA.points).forEach(([id,p])=>{let c=document.createElementNS(NS,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',current===Number(id)?7:5);if(current===Number(id))c.classList.add('active');c.dataset.id=id;svg.appendChild(c)});counter.textContent=used.length+' / '+DATA.edges.length+' lines completed';if(used.length===DATA.edges.length){status.innerHTML='<span class="ok">🎉 Congratulations! Mathematically verified puzzle solved!</span>';}}function visit(id){if(playing)return;if(current===null){current=id;route=[id];status.textContent='Continue from highlighted dot';draw();return}if(id===current)return;let idx=keys.indexOf(edgeKey(current,id));if(idx<0||used.includes(idx)){status.textContent='Not an available unused line';return}used.push(idx);route.push(id);current=id;status.textContent='Good! Continue tracing';draw()}function nearest(ev){let r=svg.getBoundingClientRect();let x=(ev.clientX-r.left)/r.width*440,y=(ev.clientY-r.top)/r.height*440;let best=null,dist=22;for(let [id,p] of Object.entries(DATA.points)){let d=Math.hypot(p[0]-x,p[1]-y);if(d<dist){dist=d;best=Number(id)}}return best}svg.addEventListener('pointerdown',e=>{let n=nearest(e);if(n!==null)visit(n)});svg.addEventListener('pointermove',e=>{if(e.buttons!==1)return;let n=nearest(e);if(n!==null)visit(n)});document.getElementById('undo').onclick=()=>{if(playing)return;if(used.length){used.pop();route.pop();current=route.at(-1)??null;status.textContent='Last line undone';draw()}};document.getElementById('retry').onclick=()=>{clearInterval(timer);playing=false;used=[];current=null;route=[];status.textContent='Start from any dot';draw()};document.getElementById('hint').onclick=()=>{if(playing)return;let remaining=DATA.edges.filter((e,i)=>!used.includes(i));if(current===null){status.textContent='Hint: Start from the yellow highlighted dot in solution mode, or any dot for this closed Euler circuit.'}else{let opts=remaining.filter(e=>e.includes(current));status.textContent=opts.length?'Available exits from this dot: '+opts.length+' (not every exit leads to a full solution)':'Dead end. Undo to recover.'}};document.getElementById('solve').onclick=()=>{clearInterval(timer);used=[];route=[DATA.solution[0]];current=route[0];playing=true;let i=0;status.textContent='Showing verified Euler circuit...';draw();timer=setInterval(()=>{if(i>=DATA.solution.length-1){clearInterval(timer);playing=false;return}let a=DATA.solution[i],b=DATA.solution[i+1],idx=keys.indexOf(edgeKey(a,b));used.push(idx);current=b;route.push(b);i++;draw()},65)};draw();</script></body></html>
