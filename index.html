<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>One Line Geometry</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#192d60,#060b1c 70%);color:white;font-family:system-ui,sans-serif;min-height:100dvh;display:flex;justify-content:center}.app{width:min(100%,520px);padding:18px 14px 12px;display:flex;flex-direction:column;gap:14px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0;color:#6deaff;letter-spacing:1px}small{color:#a4b5d8}.board{background:#0d1835;border:1px solid #34517d;border-radius:22px;box-shadow:0 0 28px #0b5fb733;touch-action:none;aspect-ratio:1;position:relative;overflow:hidden}svg{width:100%;height:100%;touch-action:none}.edge{stroke:#526785;stroke-width:3.2;stroke-linecap:round}.done{stroke:#20f1dc;stroke-width:5;filter:drop-shadow(0 0 4px #18e7d9)}.node{fill:#d9faff;stroke:#2bb8f3;stroke-width:2}.active{fill:#ffdf6b;stroke:#ff9f2c;stroke-width:3}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{background:#1b2e55;color:white;border:1px solid #355987;border-radius:13px;padding:13px 5px;font-weight:700;font-size:14px}button:active{transform:scale(.97)}.primary{background:linear-gradient(100deg,#057ca9,#4d45cf);border:0}.status{text-align:center;min-height:24px;color:#b6c9e9;font-size:13px}.ad{margin-top:auto;text-align:center;background:#121e36;border:1px dashed #49607d;border-radius:9px;padding:12px;color:#8494b2;font-size:12px}.overlay{position:fixed;inset:0;background:#030817c9;display:none;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.show{display:flex}.modal{background:#142448;border:1px solid #55c5ff;border-radius:24px;padding:27px 20px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 45px #127ed366}.modal h2{color:#ffda68;font-size:27px}.modal button{width:100%;margin-top:10px}.firework{font-size:48px;animation:pop .65s infinite alternate}@keyframes pop{to{transform:scale(1.2) rotate(12deg)}}.note{font-size:12px;color:#829ac0;text-align:center}</style></head><body><main class="app"><header><div><h1>✦ ONE LINE</h1><small>GEOMETRY EDITION</small></div><strong id="count">1 / 20</strong></header><div class="board"><svg id="board" viewBox="0 0 400 400" aria-label="Interactive geometry puzzle"></svg></div><div class="status" id="status">Touch a dot, then connect each line once</div><div class="controls"><button id="hint">💡 Hint</button><button id="undo">↶ Undo</button><button id="retry">⟳ Retry</button><button id="skip">⏭ Skip</button></div><button id="next" class="primary" style="display:none">NEXT PUZZLE →</button><div class="note">Lift your finger anytime. Tap or drag between dots.</div><div class="ad">Banner Ad — Demo Placeholder (Android AdMob later)</div></main><div class="overlay" id="overlay"><div class="modal"><div class="firework">🎆🎉🎇</div><h2 id="message">CONGRATULATIONS!</h2><p id="sub">Puzzle completed!</p><button class="primary" id="modalNext">NEXT PUZZLE →</button><button id="close">Stay Here</button></div></div><script>
'use strict';
// Each template is a connected geometric graph with exactly 0 or 2 odd-degree vertices.
// Each shape is a deterministic Eulerian walk mapped onto symmetric coordinates.
const templates=[
 [[0,0],[4,0],[4,4],[0,4],[2,2]],
 [[2,0],[4,2],[2,4],[0,2],[2,2]],
 [[2,0],[4,1],[4,3],[2,4],[0,3],[0,1],[2,2]],
 [[0,0],[4,0],[4,4],[0,4],[2,0],[4,2],[2,4],[0,2],[2,2]],
 [[2,0],[3,1],[4,2],[3,3],[2,4],[1,3],[0,2],[1,1],[2,2]],
 [[0,0],[2,0],[4,0],[4,2],[4,4],[2,4],[0,4],[0,2],[2,2]],
 [[2,0],[4,1],[3,2],[4,3],[2,4],[0,3],[1,2],[0,1],[2,2]],
 [[0,0],[4,0],[4,4],[0,4],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[2,0],[4,0],[4,2],[4,4],[2,4],[0,4],[0,2],[0,0],[2,2]],
 [[0,1],[2,0],[4,1],[4,3],[2,4],[0,3],[1,2],[3,2],[2,2]],
 [[0,0],[2,0],[4,0],[4,2],[4,4],[2,4],[0,4],[0,2],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[2,0],[3,0],[4,1],[4,3],[3,4],[1,4],[0,3],[0,1],[1,0],[2,2]],
 [[0,0],[4,0],[4,4],[0,4],[2,0],[4,2],[2,4],[0,2],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[2,0],[3,1],[4,0],[4,2],[3,3],[4,4],[2,4],[1,3],[0,4],[0,2],[1,1],[0,0],[2,2]],
 [[0,0],[2,0],[4,0],[4,2],[4,4],[2,4],[0,4],[0,2],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[2,0],[4,0],[4,2],[4,4],[2,4],[0,4],[0,2],[0,0],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[0,0],[1,0],[3,0],[4,0],[4,1],[4,3],[4,4],[3,4],[1,4],[0,4],[0,3],[0,1],[2,2]],
 [[2,0],[4,1],[4,3],[2,4],[0,3],[0,1],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[0,0],[2,0],[4,0],[4,2],[4,4],[2,4],[0,4],[0,2],[1,1],[3,1],[3,3],[1,3],[2,2]],
 [[2,0],[3,0],[4,1],[4,2],[4,3],[3,4],[2,4],[1,4],[0,3],[0,2],[0,1],[1,0],[1,1],[3,1],[3,3],[1,3],[2,2]]
];
// Build graph from visually intentional rings: outer boundary, central spokes and optional inner ring.
function makePuzzle(i){const raw=templates[i],n=raw.length,center=n-1;let edges=[];function add(a,b){if(a===b)return;let k=[Math.min(a,b),Math.max(a,b)];if(!edges.some(e=>e[0]===k[0]&&e[1]===k[1]))edges.push(k)}
// Sort perimeter points angularly, excluding center. All edges straight.
let order=raw.slice(0,-1).map((p,j)=>({j,a:Math.atan2(p[1]-2,p[0]-2)})).sort((a,b)=>a.a-b.a).map(x=>x.j);
for(let j=0;j<order.length;j++)add(order[j],order[(j+1)%order.length]);
// Spokes added in pairs, keeping degree even at the hub and at outer vertices by using triangles.
const candidates=[];for(let j=0;j<order.length;j++){let a=order[j],b=order[(j+1)%order.length];if(raw[a][0]===2||raw[a][1]===2||raw[b][0]===2||raw[b][1]===2)candidates.push([a,b])}
let chosen=candidates.length?candidates[(i*3)%candidates.length]:[order[0],order[1]];add(center,chosen[0]);add(center,chosen[1]);
// Add 1-3 extra triangles on outer boundary using a nonadjacent hub-like vertex, each preserving Euler property.
let extras=Math.min(3,Math.floor(i/6));for(let z=0;z<extras;z++){let a=order[(z*3+i)%order.length],b=order[(z*3+i+1)%order.length],c=order[(z*3+i+2)%order.length];if(!edges.some(e=>e.includes(a)&&e.includes(c))){add(a,c)}}
// Normalize degrees by removing any chord that creates odd degrees, ensuring a real Euler circuit.
let deg=Array(n).fill(0);edges.forEach(([a,b])=>{deg[a]++;deg[b]++});let odd=deg.map((d,j)=>d%2?j:-1).filter(j=>j>=0);if(odd.length>2){for(let j=edges.length-1;j>=order.length&&odd.length>2;j--){let [a,b]=edges[j];if(odd.includes(a)&&odd.includes(b)){edges.splice(j,1);deg[a]--;deg[b]--;odd=deg.map((d,k)=>d%2?k:-1).filter(k=>k>=0)}}}
// Guaranteed fallback: the perimeter cycle alone is Eulerian.
if(odd.length>2){edges=[];for(let j=0;j<order.length;j++)add(order[j],order[(j+1)%order.length]);}
const used=new Set(edges.flat());const vertices=raw.map(([x,y])=>[45+x*77.5,45+y*77.5]);return {vertices,edges,used};}
let level=Math.max(0,Math.min(19,Number(localStorage.getItem('geometry20_level')||0))),puzzle,selected=null,trail=[],done=new Set(),pointerDown=false,complete=false;
const $=id=>document.getElementById(id),svg=$('board');function edgeIndex(a,b){return puzzle.edges.findIndex(([x,y])=>(x===a&&y===b)||(x===b&&y===a))}
function render(){svg.innerHTML='';const NS='http://www.w3.org/2000/svg';const el=(name,attrs)=>{let e=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));svg.appendChild(e);return e};puzzle.edges.forEach(([a,b],i)=>{const A=puzzle.vertices[a],B=puzzle.vertices[b];el('line',{x1:A[0],y1:A[1],x2:B[0],y2:B[1],class:'edge '+(done.has(i)?'done':'')})});puzzle.vertices.forEach(([x,y],i)=>{if(!puzzle.used.has(i))return;el('circle',{cx:x,cy:y,r:i===selected?8:6,class:i===selected?'active':'node'})});$('count').textContent=`${level+1} / 20`;$('next').style.display=complete?'block':'none';}
function hit(e){let r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*400/r.width,y=(e.clientY-r.top)*400/r.height,best=-1,dist=24;for(let i of puzzle.used){let [a,b]=puzzle.vertices[i],d=Math.hypot(a-x,b-y);if(d<dist){dist=d;best=i}}return best}
function touchNode(v){if(v<0||complete)return;if(selected===null){selected=v;trail=[v];render();return}if(v===selected)return;let idx=edgeIndex(selected,v);if(idx<0||done.has(idx))return;done.add(idx);trail.push(v);selected=v;if(done.size===puzzle.edges.length){complete=true;localStorage.setItem('geometry20_level',String(Math.min(19,level+1)));$('status').textContent='All lines completed!';const msgs=['CONGRATULATIONS!','GREAT JOB!','YIPPEE!','AMAZING!','EXCELLENT!'];$('message').textContent=msgs[level%msgs.length];$('sub').textContent=`Puzzle ${level+1} completed!`;$('modalNext').textContent=level===19?'PLAY AGAIN':'NEXT PUZZLE →';$('overlay').classList.add('show')}else $('status').textContent=`${done.size} / ${puzzle.edges.length} lines traced`;render()}
svg.addEventListener('pointerdown',e=>{pointerDown=true;svg.setPointerCapture(e.pointerId);touchNode(hit(e))});svg.addEventListener('pointermove',e=>{if(pointerDown)touchNode(hit(e))});svg.addEventListener('pointerup',()=>pointerDown=false);svg.addEventListener('pointercancel',()=>pointerDown=false);
function load(){puzzle=makePuzzle(level);selected=null;trail=[];done=new Set();complete=false;$('overlay').classList.remove('show');$('status').textContent='Touch a dot, then connect each line once';render()}
$('retry').onclick=load;$('undo').onclick=()=>{if(complete)return;if(trail.length>1){let b=trail.pop(),a=trail[trail.length-1];done.delete(edgeIndex(a,b));selected=a}else{selected=null;trail=[]}$('status').textContent=`${done.size} / ${puzzle.edges.length} lines traced`;render()};
function demoReward(kind){if(!confirm('Demo rewarded ad: Watch simulated ad to '+kind+'?\n\nReal ads require Android AdMob integration.'))return; if(kind==='skip'){level=Math.min(19,level+1);localStorage.setItem('geometry20_level',String(level));load()}else{let odd=puzzle.vertices.map((_,i)=>puzzle.edges.filter(e=>e.includes(i)).length%2?i:-1).filter(x=>x>=0);$('status').textContent=odd.length?'Hint: start at a glowing endpoint (odd-degree dot)':'Hint: start at any dot; follow unused lines';}}$('hint').onclick=()=>demoReward('hint');$('skip').onclick=()=>demoReward('skip');function next(){level=level===19?0:level+1;localStorage.setItem('geometry20_level',String(level));load()}$('next').onclick=next;$('modalNext').onclick=next;$('close').onclick=()=>$('overlay').classList.remove('show');load();
</script></body></html>
