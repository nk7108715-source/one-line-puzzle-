<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>One Line Puzzle</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font:16px system-ui;text-align:center}header{padding:20px 12px 8px}h1{margin:0;font-size:25px}.sub{color:#94a3b8;font-size:13px;margin:6px}main{max-width:540px;margin:auto;padding:12px}.panel{background:#172338;border:1px solid #334155;border-radius:22px;padding:14px}svg{width:100%;aspect-ratio:1;touch-action:none;user-select:none}.edge{stroke:#53647e;stroke-width:7;stroke-linecap:round}.done{stroke:#34d399}.node{fill:#e2e8f0;stroke:#172338;stroke-width:3}.active{fill:#fbbf24}.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}button{background:#2563eb;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px}button:disabled{opacity:.4}.secondary{background:#334155}#status{min-height:48px;color:#cbd5e1;margin:12px 0 0}#counter{color:#34d399;font-weight:700}#level{color:#93c5fd}small{color:#94a3b8}</style></head><body><header><h1>✏️ One Line Puzzle</h1><p class="sub">One stroke. No repeated lines. No lifting.</p></header><main><div class="panel"><h2 id="level">Level 1</h2><div id="counter"></div><svg id="board" viewBox="0 0 320 320" aria-label="Puzzle drawing area"></svg><p id="status">Touch a dot and drag across every line without lifting your finger.</p><div class="btns"><button class="secondary" id="restart">↻ Retry</button><button id="next" disabled>Next Level →</button></div></div><p><small>Progress saved on this device • Works offline after loading</small></p></main><script>
const levels=[
{p:[[60,70],[260,70],[260,250],[60,250]],e:[[0,1],[1,2],[2,3],[3,0],[0,2]]},
{p:[[160,35],[280,130],[235,270],[85,270],[40,130]],e:[[0,1],[1,2],[2,3],[3,4],[4,0],[0,2],[2,4]]},
{p:[[60,60],[260,60],[260,260],[60,260],[160,160]],e:[[0,1],[1,2],[2,3],[3,0],[0,4],[1,4],[2,4],[3,4]]},
{p:[[160,35],[285,125],[235,270],[85,270],[35,125],[160,150]],e:[[0,1],[1,2],[2,3],[3,4],[4,0],[0,5],[1,5],[2,5],[3,5],[4,5]]},
{p:[[60,60],[160,60],[260,60],[60,160],[160,160],[260,160],[60,260],[160,260],[260,260]],e:[[0,1],[1,2],[2,5],[5,8],[8,7],[7,6],[6,3],[3,0],[1,4],[4,7],[3,4],[4,5]]}
];
// Each graph has 0 or 2 odd-degree vertices and is connected.
let level=Math.min(Number(localStorage.getItem('oneLineLevel')||0),levels.length-1),used=new Set(),current=null,drawing=false,won=false,pointer=null;
const board=document.getElementById('board'),status=document.getElementById('status'),counter=document.getElementById('counter'),next=document.getElementById('next');
const NS='http://www.w3.org/2000/svg';function elem(tag,attrs){let x=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);board.appendChild(x);return x}
function draw(){board.replaceChildren();let l=levels[level];document.getElementById('level').textContent=`Level ${level+1} / ${levels.length}`;counter.textContent=`${used.size} / ${l.e.length} lines completed`;l.e.forEach(([a,b],i)=>elem('line',{x1:l.p[a][0],y1:l.p[a][1],x2:l.p[b][0],y2:l.p[b][1],class:'edge '+(used.has(i)?'done':'')}));l.p.forEach(([x,y],i)=>elem('circle',{cx:x,cy:y,r:11,class:'node '+(current===i?'active':'')}));next.disabled=!won;}
function point(ev){let r=board.getBoundingClientRect(),x=(ev.clientX-r.left)*320/r.width,y=(ev.clientY-r.top)*320/r.height;return [x,y]}
function nearest(p){let l=levels[level],best=-1,dist=22;for(let i=0;i<l.p.length;i++){let d=Math.hypot(p[0]-l.p[i][0],p[1]-l.p[i][1]);if(d<dist){dist=d;best=i}}return best}
function reset(msg='Touch a dot and drag across every line without lifting your finger.'){used.clear();current=null;drawing=false;won=false;pointer=null;status.textContent=msg;draw()}
board.addEventListener('pointerdown',e=>{if(won)return;e.preventDefault();reset('Keep your finger down and follow the lines.');let n=nearest(point(e));if(n<0){status.textContent='Start on a dot.';return}drawing=true;pointer=e.pointerId;current=n;board.setPointerCapture(e.pointerId);draw()});
board.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pointer||won)return;e.preventDefault();let p=point(e),l=levels[level];let changed=true;while(changed){changed=false;for(let i=0;i<l.e.length;i++){if(used.has(i))continue;let [a,b]=l.e[i],to=a===current?b:b===current?a:-1;if(to<0)continue;let A=l.p[current],B=l.p[to],vx=B[0]-A[0],vy=B[1]-A[1],t=((p[0]-A[0])*vx+(p[1]-A[1])*vy)/(vx*vx+vy*vy);let cross=Math.abs((p[0]-A[0])*vy-(p[1]-A[1])*vx)/Math.hypot(vx,vy);if(t>=.83&&cross<19){used.add(i);current=to;changed=true;break}}}if(used.size===l.e.length){won=true;drawing=false;status.textContent='🎉 Perfect! Puzzle completed in one stroke!';localStorage.setItem('oneLineLevel',Math.max(level+1,Number(localStorage.getItem('oneLineLevel')||0)));}draw()});
function lift(e){if(!drawing||e.pointerId!==pointer)return;drawing=false;if(!won)reset('Finger lifted before completion. Try again!')}
board.addEventListener('pointerup',lift);board.addEventListener('pointercancel',lift);document.getElementById('restart').onclick=()=>reset();next.onclick=()=>{if(!won)return;if(level<levels.length-1){level++;reset()}else status.textContent='🏆 All demo levels complete! More levels coming soon.'};reset();
</script></body></html>
